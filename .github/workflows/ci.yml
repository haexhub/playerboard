name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Structural schema changes are generated by drizzle-kit. A schema edit
      # without its generated migration leaves the snapshot stale, and the next
      # `db:generate` would re-emit it on top of whatever is already applied.
      - name: Drizzle schema matches the committed migrations
        run: |
          timeout 120 pnpm db:generate
          git status --porcelain -- supabase/migrations
          test -z "$(git status --porcelain -- supabase/migrations)"

      # The CLI is a pinned devDependency; migrations are validated with the
      # same version the Docker image applies them with.
      - run: pnpm exec supabase start

      - run: pnpm exec supabase db reset

      - run: pnpm gen:types

      # Constitution V: generated types must be committed alongside the
      # migration that changed the schema.
      - run: git diff --exit-code -- app/types/database.ts

      - name: Write .env from local Supabase status
        run: |
          STATUS=$(pnpm exec supabase status -o env)
          echo "SUPABASE_URL=$(echo "$STATUS" | grep '^API_URL=' | cut -d= -f2-)" >> .env
          echo "SUPABASE_KEY=$(echo "$STATUS" | grep '^ANON_KEY=' | cut -d= -f2-)" >> .env
          echo "SUPABASE_SERVICE_KEY=$(echo "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2-)" >> .env
          echo "NUXT_SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2-)" >> .env
          echo "NUXT_SUPABASE_DB_URL=$(echo "$STATUS" | grep '^DB_URL=' | cut -d= -f2-)" >> .env

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test:unit

      - run: pnpm test:integration

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
